name: "Setup Project"
description: "Checks out the repo, installs Flutter (or Dart-only), installs dependencies, and runs code generation. Supports both Flutter and plain Dart projects."
inputs:
  working-directory:
    description: "Working directory of the project"
    required: false
    default: "."
  type:
    description: "Project type: 'flutter' or 'dart'"
    required: false
    default: "flutter"

runs:
  using: "composite"
  steps:
    # ponytail: checkout is done by calling workflow before using this action
    - name: 🛠️ Get Flutter SDK version from fvm_config.json
      uses: kuhnroyal/flutter-fvm-config-action@v3
      with:
        path: .fvm/fvm_config.json

    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2.17.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: 📊 Setup LCOV
      uses: hrishikesh-kadam/setup-lcov@v1

    # Flutter projects: pub get via flutter (resolves Flutter SDK deps)
    - name: 📦 Install Dependencies (Flutter)
      if: ${{ inputs.type == 'flutter' }}
      run: flutter pub get --no-example
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    # Dart-only projects: pub get via dart (no Flutter SDK required)
    - name: 📦 Install Dependencies (Dart)
      if: ${{ inputs.type == 'dart' }}
      run: dart pub get
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    # Localization generation only for Flutter projects (skip for baktaz_shared)
    - name: ⚙️ Run Slang
      if: ${{ inputs.type == 'flutter' && inputs.working-directory != 'baktaz_shared' }}
      run: dart run slang
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: ⚙️ Run baktaz_shared Code Generation
      if: ${{ inputs.working-directory != 'baktaz_shared' && inputs.working-directory != '.' }}
      run: dart run build_runner build
      shell: bash
      working-directory: baktaz_shared

    # Always run build_runner for mocks, freezed, etc.
    - name: ⚙️ Run build_runner
      run: dart run build_runner build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
