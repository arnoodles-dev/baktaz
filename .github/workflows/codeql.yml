name: CodeQL & Static Security Analysis

on:
  push:
    branches: ["dev"]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze-actions:
    name: CodeQL GitHub Actions Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dart-static-analysis:
    name: Dart & Flutter Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Fetch Pub Dependencies (baktaz_shared)
        run: dart pub get
        working-directory: baktaz_shared

      - name: Fetch Pub Dependencies (baktaz_server)
        run: dart pub get
        working-directory: baktaz_server

      - name: Fetch Pub Dependencies (baktaz_flutter)
        run: flutter pub get
        working-directory: baktaz_flutter

      - name: Fetch Pub Dependencies (baktaz_admin)
        run: flutter pub get
        working-directory: baktaz_admin

      - name: Run Dart Analyzer
        run: dart analyze --fatal-infos
