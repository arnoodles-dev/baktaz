name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        working-directory: baktas_server
        run: dart analyze --fatal-infos
