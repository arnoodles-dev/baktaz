name: baktaz_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: ">=3.13.0 <4.0.0"

resolution: workspace

dependencies:
  chopper: ^8.7.0
  email_validator: ^3.0.0
  fpdart: ^1.2.0
  get_it: ^9.2.1
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  injectable: ^3.0.0
  serverpod: 4.0.0-beta.3
  serverpod_auth_core_server: 4.0.0-beta.3
  serverpod_auth_idp_server: 4.0.0-beta.3
  serverpod_auth_server: 4.0.0-beta.3

dev_dependencies:
  build_runner: ^2.16.0
  chopper_generator: ^8.7.0
  coverage: ^1.15.1
  injectable_generator: ^3.1.3
  lints: ^6.1.0
  mockito: ^5.8.1
  serverpod_test: 4.0.0-beta.3
  test: ^1.31.1

serverpod:
  scripts:
    # # Build the Flutter web app and copy it to the server's web directory.
    # # Windows uses xcopy since flutter's --output flag doesn't work there.
    # # See: https://github.com/flutter/flutter/issues/157886
    # flutter_build:
    #   windows: >-
    #     (if exist web\app rmdir /S /Q web\app)
    #     & cd /D ..\baktaz_admin
    #     && flutter build web --base-href /app/
    #     && xcopy /E /I /Y build\web ..\baktaz_server\web\app
    #   posix: |
    #     cd ../baktaz_admin
    #     flutter build web --base-href /app/ --output ../baktaz_server/web/app

  # Companion Flutter apps that `serverpod start` can launch (Ctrl+R), keyed
  # by a display alias. The default device is the web server, opening the
  # machine's default browser when ready. All non-reserved properties are
  # forwarded to `flutter run`. For the best IDE debugging experience, use
  # `chrome` or a native target as the device. See the example below:
  #

  flutter_apps:
    baktaz_app:
      path: ../baktaz_flutter
      displayName: "Baktaz"
      device: iPhone 17 Pro Max
      auto_launch: true
      target: lib/driver.dart
      flavor: development
      dart-define-from-file: |
        assets/env/.env.development

    baktaz_admin:
      path: ../baktaz_admin
      displayName: "Admin"
      auto_launch: false
      device: Chrome
      target: lib/main.dart
      web-hostname: 0.0.0.0
      web-port: 8090
      release: true
      pub: false
      # dart-define:
      #   API_URL=https://admin.example.com
      #   FLAVOR=production
