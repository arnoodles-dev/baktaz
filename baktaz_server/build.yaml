targets:
  $default:
    builders:
      injectable_generator|injectable_builder:
        generate_for:
          - lib/src/app/injection/**.dart
          - lib/src/features/**/data/repository/**.dart
          - lib/src/features/**/data/service/**.dart
      chopper_generator:
        generate_for:
          - lib/src/features/**/data/service/**.dart
      mockito|mockBuilder:
        generate_for:
          - test/utils/generated_mocks.dart
